[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-plan-assistant"
version = "0.1.0"
description = "Local ETF recurring-investment and drawdown reminder assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ETF Plan Assistant Contributors" }]
dependencies = ["tzdata>=2025.2; platform_system == 'Windows'"]

[project.optional-dependencies]
market = ["akshare>=1.16"]
desktop = ["keyring>=25", "PySide6>=6.7"]
build = ["pyinstaller>=6.10"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
etf-assistant = "etf_assistant.cli:main"
etf-assistant-ui = "etf_assistant.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
